name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check public site contract
        run: python3 tests/site-check.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Check out latest UI source
        id: ui_checkout
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: aslater3/LibreEcho-UI
          ref: main
          path: ui-source
          token: ${{ secrets.UI_REPOSITORY_TOKEN || github.token }}
      - name: Build UI demo
        if: steps.ui_checkout.outcome == 'success'
        run: make -C ui-source -j2
      - name: Start UI demo server
        if: steps.ui_checkout.outcome == 'success'
        run: |
          ./ui-source/build/libreecho-web --backend mock --web-root ./ui-source/web \
            --listen 127.0.0.1:18080 --mock-config ./ui-source/config/mock-state.json \
            --config "$RUNNER_TEMP/libreecho-demo-config.json" --seed 42 --dev-controls \
            >"$RUNNER_TEMP/libreecho-demo.log" 2>&1 &
          echo $! >"$RUNNER_TEMP/libreecho-demo.pid"
          for attempt in $(seq 1 20); do curl -fsS http://127.0.0.1:18080/ >/dev/null && break; sleep 1; done
      - name: Render current UI screenshots
        if: steps.ui_checkout.outcome == 'success'
        run: |
          mkdir -p "$RUNNER_TEMP/ui-capture"
          npm --prefix "$RUNNER_TEMP/ui-capture" install --no-save playwright@1.52.0
          npx --prefix "$RUNNER_TEMP/ui-capture" playwright install --with-deps chromium
          cat >"$RUNNER_TEMP/ui-capture/capture-ui.mjs" <<'EOF'
          import { chromium } from 'playwright';
          const output = process.env.GITHUB_WORKSPACE;
          const browser = await chromium.launch({headless: true});
          const page = await browser.newPage({viewport: {width: 1440, height: 914}, deviceScaleFactor: 1});
          const privateData = /(?:\b\d{1,3}\.){3}\d{1,3}\b|(?:[0-9a-f]{2}[:-]){5}[0-9a-f]{2}|\/home\/andy|G2A0RF/i;
          const capture = async (route, path, wait) => {
            await page.goto(`http://127.0.0.1:18080/${route}`, {waitUntil: 'networkidle'});
            await page.waitForTimeout(wait);
            const renderedText = await page.locator('body').innerText();
            if (privateData.test(renderedText)) throw new Error(`private-looking rendered UI text in ${route}`);
            await page.screenshot({path});
          };
          await capture('#overview', `${output}/assets/images/ui-dashboard.png`, 2500);
          await capture('#system', `${output}/assets/images/ui-system.png`, 1500);
          await browser.close();
          EOF
          (cd "$RUNNER_TEMP/ui-capture" && node capture-ui.mjs)
      - name: Stop UI demo server
        if: always()
        run: test ! -f "$RUNNER_TEMP/libreecho-demo.pid" || kill "$(cat "$RUNNER_TEMP/libreecho-demo.pid")" || true
      - name: Check generated UI artifacts for private strings
        if: steps.ui_checkout.outcome == 'success'
        run: |
          for image in assets/images/ui-dashboard.png assets/images/ui-system.png; do
            if strings "$image" | grep -Eiq '([0-9]{1,3}\.){3}[0-9]{1,3}|([0-9A-Fa-f]{2}[:-]){5}[0-9A-Fa-f]{2}|/home/andy|G2A0RF'; then
              echo "private-looking string found in $image" >&2
              exit 1
            fi
          done
      - name: Stage only the site for Pages
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          rsync -a --exclude='.git' --exclude='ui-source' --exclude='tests' --exclude='.github' ./ "$RUNNER_TEMP/site/"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
