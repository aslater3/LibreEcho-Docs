name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Check out latest UI source
        uses: actions/checkout@v4
        with:
          repository: aslater3/LibreEcho-UI
          ref: main
          path: ui-source
      - name: Build UI demo
        run: make -C ui-source -j2
      - name: Start UI demo server
        run: |
          ./ui-source/build/libreecho-web --backend mock --web-root ./ui-source/web \
            --listen 127.0.0.1:18080 --mock-config ./ui-source/config/mock-state.json \
            --config "$RUNNER_TEMP/libreecho-demo-config.json" --seed 42 --dev-controls \
            >"$RUNNER_TEMP/libreecho-demo.log" 2>&1 &
          echo $! >"$RUNNER_TEMP/libreecho-demo.pid"
          for attempt in $(seq 1 20); do curl -fsS http://127.0.0.1:18080/ >/dev/null && break; sleep 1; done
      - name: Render current UI screenshots
        run: |
          mkdir -p "$RUNNER_TEMP/ui-capture"
          npm --prefix "$RUNNER_TEMP/ui-capture" install --no-save playwright@1.52.0
          npx --prefix "$RUNNER_TEMP/ui-capture" playwright install --with-deps chromium
          cat >"$RUNNER_TEMP/ui-capture/capture-ui.mjs" <<'EOF'
          import { chromium } from 'playwright';
          const output = process.env.GITHUB_WORKSPACE;
          const browser = await chromium.launch({headless: true});
          const page = await browser.newPage({viewport: {width: 1440, height: 914}, deviceScaleFactor: 1});
          await page.goto('http://127.0.0.1:18080/#overview', {waitUntil: 'networkidle'});
          await page.waitForTimeout(2500);
          await page.screenshot({path: `${output}/assets/images/ui-dashboard.png`});
          await page.goto('http://127.0.0.1:18080/#system', {waitUntil: 'networkidle'});
          await page.waitForTimeout(1500);
          await page.screenshot({path: `${output}/assets/images/ui-system.png`});
          await browser.close();
          EOF
          (cd "$RUNNER_TEMP/ui-capture" && node capture-ui.mjs)
      - name: Stop UI demo server
        if: always()
        run: test ! -f "$RUNNER_TEMP/libreecho-demo.pid" || kill "$(cat "$RUNNER_TEMP/libreecho-demo.pid")" || true
      - name: Stage only the site for Pages
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          rsync -a --exclude='.git' --exclude='ui-source' ./ "$RUNNER_TEMP/site/"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
